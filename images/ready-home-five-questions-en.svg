<svg xmlns="http://www.w3.org/2000/svg" width="620" height="822" viewBox="0 0 620 822" role="img"><rect width="620" height="100%" rx="27" fill="#edf3e9"/><path d="M0 0h620v14H0z" fill="#b18a58"/><text x="34" y="65" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#15382e">Ready or near handover? Ask five things</text><text x="34" y="103" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#567466">Confirm the stage before comparing</text><rect x="36" y="134" width="548" height="117" rx="18" fill="#fff" stroke="#d6e3d9"/><circle cx="78" cy="174" r="22" fill="#24664f"/><text x="70" y="182" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#fff">1</text><text x="118" y="180" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#15382e">Stage</text><text x="58" y="223" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#33574a">Can you inspect it, or is delivery pending?</text><rect x="36" y="269" width="548" height="117" rx="18" fill="#fff" stroke="#d6e3d9"/><circle cx="78" cy="309" r="22" fill="#24664f"/><text x="70" y="317" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#fff">2</text><text x="118" y="315" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#15382e">Exact unit</text><text x="58" y="358" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#33574a">Is this the home actually being offered?</text><rect x="36" y="404" width="548" height="117" rx="18" fill="#fff" stroke="#d6e3d9"/><circle cx="78" cy="444" r="22" fill="#24664f"/><text x="70" y="452" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#fff">3</text><text x="118" y="450" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#15382e">Handover</text><text x="58" y="493" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#33574a">Check completion, CCC, VP and keys</text><rect x="36" y="539" width="548" height="117" rx="18" fill="#fff" stroke="#d6e3d9"/><circle cx="78" cy="579" r="22" fill="#24664f"/><text x="70" y="587" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#fff">4</text><text x="118" y="585" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#15382e">Home type</text><text x="58" y="628" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#33574a">What differs for landed and serviced units?</text><rect x="36" y="674" width="548" height="117" rx="18" fill="#fff" stroke="#d6e3d9"/><circle cx="78" cy="714" r="22" fill="#24664f"/><text x="70" y="722" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#fff">5</text><text x="118" y="720" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#15382e">Costs</text><text x="58" y="763" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#33574a">What continues beyond the sale price?</text><text x="35" y="789" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#637b6f">Esther JB Property · Concept checklist · 12 Oct 2026</text></svg>