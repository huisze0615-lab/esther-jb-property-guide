<svg xmlns="http://www.w3.org/2000/svg" width="640" height="648" viewBox="0 0 640 648"><title>两笔钱，用途先分清</title><desc>管理费｜日常管理与维护：例如公共部分清洁、保安和日常维护；维修基金｜较大资本开支：例如公共部分重漆、设备更新与更换；空置不等于自动免缴：核对管理阶段、合同、交付及正式通知；先索取分项收费表：确认金额、依据、起算日与优惠范围。原创教学示意，非项目报价。</desc><rect width="640" height="648" rx="20" fill="#f7f5ee"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="34" y="59" fill="#224e40" font-size="31" font-weight="700">两笔钱，用途先分清</text><text x="34" y="102" fill="#687b70" font-size="18">不凭“没入住”或广告一句话判断付款。</text><rect x="34" y="141" width="572" height="93" rx="14" fill="white" stroke="#d6e2db"/><text x="56" y="177" fill="#224e40" font-size="23" font-weight="700">管理费｜日常管理与维护</text><text x="56" y="209" fill="#526f63" font-size="18">例如公共部分清洁、保安和日常维护</text><rect x="34" y="253" width="572" height="93" rx="14" fill="#eaf2ee" stroke="#d6e2db"/><text x="56" y="289" fill="#224e40" font-size="23" font-weight="700">维修基金｜较大资本开支</text><text x="56" y="321" fill="#526f63" font-size="18">例如公共部分重漆、设备更新与更换</text><rect x="34" y="365" width="572" height="93" rx="14" fill="white" stroke="#d6e2db"/><text x="56" y="401" fill="#224e40" font-size="23" font-weight="700">空置不等于自动免缴</text><text x="56" y="433" fill="#526f63" font-size="18">核对管理阶段、合同、交付及正式通知</text><rect x="34" y="477" width="572" height="93" rx="14" fill="#eaf2ee" stroke="#d6e2db"/><text x="56" y="513" fill="#224e40" font-size="23" font-weight="700">先索取分项收费表</text><text x="56" y="545" fill="#526f63" font-size="18">确认金额、依据、起算日与优惠范围</text><text x="34" y="626" fill="#687b70" font-size="15">Esther JB Property · 原创示意 · 具体费用按正式文件核对</text></g></svg>