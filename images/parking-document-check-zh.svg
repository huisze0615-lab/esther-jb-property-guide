<svg xmlns="http://www.w3.org/2000/svg" width="640" height="675" viewBox="0 0 640 675"><title>“附送车位”，先核对什么？</title><desc>确认销售介绍对应的单位；索取数量、编号与位置资料；确认尚未分配的项目；律师核对产权及交易文件；管理方说明日常使用规则。原创示意，不是项目规划。</desc><rect width="640" height="675" rx="22" fill="#f6f5ef"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="42" y="65" font-size="31" font-weight="700" fill="#24413b">“附送车位”，先核对什么？</text><text x="42" y="104" font-size="18" fill="#60746c">从销售介绍，到具体单位的正式资料。</text><rect x="42" y="145" width="556" height="69" rx="13" fill="#fff" stroke="#d4e2de"/><circle cx="77" cy="180" r="18" fill="#285c50"/><text x="77" y="187" text-anchor="middle" fill="#fff" font-size="19">1</text><text x="111" y="187" fill="#24413b" font-size="23">确认销售介绍对应的单位</text><path d="M320 218v13m-5-5 5 5 5-5" fill="none" stroke="#91aca2" stroke-width="2"/><rect x="42" y="236" width="556" height="69" rx="13" fill="#edf3f2" stroke="#d4e2de"/><circle cx="77" cy="271" r="18" fill="#285c50"/><text x="77" y="278" text-anchor="middle" fill="#fff" font-size="19">2</text><text x="111" y="278" fill="#24413b" font-size="23">索取数量、编号与位置资料</text><path d="M320 309v13m-5-5 5 5 5-5" fill="none" stroke="#91aca2" stroke-width="2"/><rect x="42" y="327" width="556" height="69" rx="13" fill="#fff" stroke="#d4e2de"/><circle cx="77" cy="362" r="18" fill="#285c50"/><text x="77" y="369" text-anchor="middle" fill="#fff" font-size="19">3</text><text x="111" y="369" fill="#24413b" font-size="23">确认尚未分配的项目</text><path d="M320 400v13m-5-5 5 5 5-5" fill="none" stroke="#91aca2" stroke-width="2"/><rect x="42" y="418" width="556" height="69" rx="13" fill="#edf3f2" stroke="#d4e2de"/><circle cx="77" cy="453" r="18" fill="#285c50"/><text x="77" y="460" text-anchor="middle" fill="#fff" font-size="19">4</text><text x="111" y="460" fill="#24413b" font-size="23">律师核对产权及交易文件</text><path d="M320 491v13m-5-5 5 5 5-5" fill="none" stroke="#91aca2" stroke-width="2"/><rect x="42" y="509" width="556" height="69" rx="13" fill="#fff" stroke="#d4e2de"/><circle cx="77" cy="544" r="18" fill="#285c50"/><text x="77" y="551" text-anchor="middle" fill="#fff" font-size="19">5</text><text x="111" y="551" fill="#24413b" font-size="23">管理方说明日常使用规则</text><text x="42" y="645" font-size="15" fill="#65766e">Esther JB Property · 原创示意 · 非项目规划或证明</text></g></svg>