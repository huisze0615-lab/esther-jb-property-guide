<svg xmlns="http://www.w3.org/2000/svg" width="640" height="648" viewBox="0 0 640 648"><title>房贷 ≠ 每月住房总开支</title><desc>每月持续费用：供款＋管理费＋维修基金＋实际使用费用；年度开支的预算预留：实际年度金额 ÷ 12；不是改成月缴；纯假设：RM2,200 → RM3,010：加上本文其他假设项目；非项目报价；入住时另外准备：按实际列装修、搬家、押金与预缴。原创教学示意，非项目报价。</desc><rect width="640" height="648" rx="20" fill="#f7f5ee"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="34" y="59" fill="#224e40" font-size="31" font-weight="700">房贷 ≠ 每月住房总开支</text><text x="34" y="102" fill="#687b70" font-size="18">把持续、年度与一次性费用分开整理。</text><rect x="34" y="141" width="572" height="93" rx="14" fill="white" stroke="#d6e2db"/><text x="56" y="177" fill="#224e40" font-size="23" font-weight="700">每月持续费用</text><text x="56" y="209" fill="#526f63" font-size="18">供款＋管理费＋维修基金＋实际使用费用</text><rect x="34" y="253" width="572" height="93" rx="14" fill="#eaf2ee" stroke="#d6e2db"/><text x="56" y="289" fill="#224e40" font-size="23" font-weight="700">年度开支的预算预留</text><text x="56" y="321" fill="#526f63" font-size="18">实际年度金额 ÷ 12；不是改成月缴</text><rect x="34" y="365" width="572" height="93" rx="14" fill="white" stroke="#d6e2db"/><text x="56" y="401" fill="#224e40" font-size="23" font-weight="700">纯假设：RM2,200 → RM3,010</text><text x="56" y="433" fill="#526f63" font-size="18">加上本文其他假设项目；非项目报价</text><rect x="34" y="477" width="572" height="93" rx="14" fill="#eaf2ee" stroke="#d6e2db"/><text x="56" y="513" fill="#224e40" font-size="23" font-weight="700">入住时另外准备</text><text x="56" y="545" fill="#526f63" font-size="18">按实际列装修、搬家、押金与预缴</text><text x="34" y="626" fill="#687b70" font-size="15">Esther JB Property · 原创示意 · 具体费用按正式文件核对</text></g></svg>